name: CI — verify and publish image
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - &id001
      name: Checkout
      uses: actions/checkout@v7
    - &id002
      name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: 'app/requirements.txt

          requirements-dev.txt'
    - &id003
      name: Install dependencies
      run: 'python -m pip install --upgrade pip

        python -m pip install -r app/requirements.txt -r requirements-dev.txt'
    - name: Pylint
      run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - *id001
    - *id002
    - *id003
    - name: Unit tests
      run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - *id001
    - name: Normalize image name
      run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
    - name: Build image
      run: docker build --tag "devops-ci-app:${GITHUB_SHA}" .
    - name: Smoke-test container
      run: "set -euo pipefail\ncleanup() {\n  docker logs smoke || true\n  docker rm -f smoke >/dev/null 2>&1 ||\
        \ true\n}\ntrap cleanup EXIT\ndocker run -d --name smoke -p 127.0.0.1:5000:5000 \"devops-ci-app:${GITHUB_SHA}\"\
        \nready=0\nfor attempt in {1..15}; do\n  if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5000/health\
        \ --output health.json; then\n    ready=1\n    break\n  fi\n  sleep 1\ndone\nif [ \"$ready\" -ne 1 ]; then\n\
        \  echo \"::error::/health did not respond after 15 attempts\"\n  exit 1\nfi\npython3 -m json.tool health.json\n\
        python3 -c 'import json; assert json.load(open(\"health.json\")) == {\"status\": \"ok\"}'\ndocker exec smoke\
        \ id\n"
    - name: Tag registry image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: 'docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}"

        docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:latest"'
    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
    - name: Push image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: 'docker push "${IMAGE_NAME}:${GITHUB_SHA}"

        docker push "${IMAGE_NAME}:latest"'
